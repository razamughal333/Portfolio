<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Raza Ahmed — CS graduate, web developer and commodity trader. Portfolio, projects and contact."
    />
    <title>Raza Ahmed | Web Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before the page paints, so there is no dark/light flash. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        var theme = saved === 'light' || saved === 'dark' ? saved : prefersLight ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
